<!-- src/broll/web/templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}B-Roll Catalog{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="top-nav">
        <div class="nav-brand">B-Roll Catalog</div>
        <div class="nav-links">
            <a href="/" class="{% if request.endpoint == 'browse' %}active{% endif %}">Browse</a>
            <a href="/timeline" class="{% if request.endpoint and request.endpoint.startswith('timeline') %}active{% endif %}">Timeline</a>
            <a href="/search" class="{% if request.endpoint == 'search_page' %}active{% endif %}">Search</a>
            <a href="/map" class="{% if request.endpoint == 'map_page' %}active{% endif %}">Map</a>
            <a href="/playlists" class="{% if request.endpoint == 'playlists_page' or request.endpoint == 'playlist_detail_page' %}active{% endif %}">Playlists</a>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
