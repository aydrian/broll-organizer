<!-- src/broll/web/templates/playlists.html -->
{% extends "base.html" %}
{% block title %}Playlists - B-Roll Catalog{% endblock %}

{% block content %}
<div class="playlists-container">
    <div class="playlists-header">
        <h1>📁 Playlists</h1>
        <button id="create-playlist-btn" class="btn-primary">+ New Playlist</button>
    </div>

    <div class="playlists-grid" id="playlists-grid">
        <div class="loader">Loading playlists...</div>
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">📂</div>
        <h3>No playlists yet</h3>
        <p>Create your first playlist to organize your B-roll clips.</p>
    </div>
</div>

<!-- Create Playlist Modal -->
<div id="create-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Create New Playlist</h3>
            <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="playlist-name">Name</label>
                <input type="text" id="playlist-name" placeholder="e.g., Japan Trip 2024" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="playlist-description">Description (optional)</label>
                <textarea id="playlist-description" rows="2" placeholder="Add a description..."></textarea>
            </div>
            <div class="form-group">
                <label>Color</label>
                <div class="color-picker">
                    <button class="color-option active" data-color="#3b82f6" style="background: #3b82f6;"></button>
                    <button class="color-option" data-color="#ef4444" style="background: #ef4444;"></button>
                    <button class="color-option" data-color="#22c55e" style="background: #22c55e;"></button>
                    <button class="color-option" data-color="#f59e0b" style="background: #f59e0b;"></button>
                    <button class="color-option" data-color="#8b5cf6" style="background: #8b5cf6;"></button>
                    <button class="color-option" data-color="#ec4899" style="background: #ec4899;"></button>
                    <button class="color-option" data-color="#14b8a6" style="background: #14b8a6;"></button>
                    <button class="color-option" data-color="#f97316" style="background: #f97316;"></button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary modal-cancel">Cancel</button>
            <button class="btn-primary" id="save-playlist-btn">Create Playlist</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/playlists.js"></script>
{% endblock %}
